name: Build TvMenu Android .so

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Native Library
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b
        add-to-path: true

    - name: Compile Library with NDK
      run: |
        ndk-build -C jni

    - name: Rename Binaries by Architecture
      run: |
        mkdir -p renamed_libs
        cp libs/armeabi-v7a/libTvMenu.so renamed_libs/TvMenu-armeabi-v7a.so
        cp libs/arm64-v8a/libTvMenu.so renamed_libs/TvMenu-arm64-v8a.so

    - name: Upload Compiled .so Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TvMenu-Architecture-Binaries
        path: |
          renamed_libs/TvMenu-armeabi-v7a.so
          renamed_libs/TvMenu-arm64-v8a.so
